<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mario Classic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }
  #gameWrap { position: relative; }
  canvas {
    display: block;
    image-rendering: pixelated;
    border: 4px solid #333;
    border-radius: 4px;
  }
  #hint {
    color: #888;
    margin-top: 10px;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="800" height="480"></canvas>
</div>
<div id="hint">← → / A D to move &nbsp;|&nbsp; SPACE / ↑ / W to jump &nbsp;|&nbsp; Hold SHIFT to run &nbsp;|&nbsp; P to pause</div>

<script>
"use strict";

// ============================================================
// SUPER MARIO CLASSIC — a nostalgic single-file platformer
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const TILE = 32;
const GRAVITY = 0.55;
const MAX_FALL = 12;

// ---------- Level definition (ASCII map) ----------
// X ground   B brick   ? question block   = used block
// P pipe top-left (auto builds pipe)     C coin
// g goomba   k koopa   F flagpole        S player start
// # solid block (stairs)
const LEVEL = [
"                                                                                                                                                                                                                ",
"                                                                                                                                                                                                                ",
"                                                                                                                                                                                                                ",
"                                                                                                                                                                                                    F           ",
"                                                                                                                                                                                                    |           ",
"           C C                                                  CCC                                                                                                                                 |           ",
"                                                                                                                                                                                                    |           ",
"        B?B?B          ?                BBBB     B?B                        B?B        BB?BB                                              ?   ?                                            #        |           ",
"                                                                CCC                                                                                                                       ##        |           ",
"                                                                                                                                                                                         ###        |           ",
"   C                              ?                                                            C C                       BBB       B                 #  #                               ####        |           ",
"              S                                  g                          C C                                                                     ##  ##              g              #####        |           ",
"                       g      P        P    g          P       BBBB    g                  g            P             g        g          g        ###  ###     g                     ######        |           ",
"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX   XXXXXXXXXXXXXXXXXXXXXXXXXXX   XXXXXXXXXXXXXXXXXXXXXXXXXXXXX   XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX   XXXXXXXXXXXXXXXXXXXXXXXXXXX   XXXXXXXXXXXXXXXXXXXXXXXXXXXXX   XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
];

const LEVEL_H = LEVEL.length;
const LEVEL_W = Math.max(...LEVEL.map(r => r.length));

// ---------- Audio (tiny chiptune beeps via WebAudio) ----------
let audioCtx = null;
function beep(freq, dur, type = "square", vol = 0.08, slide = 0) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* audio unavailable */ }
}
const sfx = {
  jump:  () => beep(420, 0.18, "square", 0.07, 300),
  coin:  () => { beep(988, 0.08, "square", 0.07); setTimeout(() => beep(1319, 0.25, "square", 0.07), 60); },
  stomp: () => beep(180, 0.15, "triangle", 0.12, -100),
  bump:  () => beep(120, 0.08, "square", 0.08),
  die:   () => { beep(494, 0.15); setTimeout(() => beep(370, 0.15), 140); setTimeout(() => beep(262, 0.4, "square", 0.08, -150), 280); },
  win:   () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2, "square", 0.07), i * 130)); },
  brick: () => beep(220, 0.1, "sawtooth", 0.06, -80),
};

// ---------- Input ----------
const keys = {};
addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "p" && game.state === "play") game.state = "pause";
  else if (e.key.toLowerCase() === "p" && game.state === "pause") game.state = "play";
  if ((game.state === "title" || game.state === "gameover" || game.state === "win") &&
      (e.key === " " || e.key === "Enter")) startGame();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
const left  = () => keys["arrowleft"] || keys["a"];
const right = () => keys["arrowright"] || keys["d"];
const jump  = () => keys[" "] || keys["arrowup"] || keys["w"];
const run   = () => keys["shift"];

// ---------- World state ----------
const game = {
  state: "title", // title | play | pause | dead | gameover | win
  score: 0, coins: 0, lives: 3, time: 300,
  camX: 0, timer: 0, frame: 0,
};

let tiles = [];      // 2D grid of tile chars
let enemies = [];
let particles = [];
let floatTexts = [];
let bumpAnims = [];  // block bump animations {c, r, t}
let flagX = 0, flagSlide = false;

const player = {
  x: 0, y: 0, w: 24, h: 30,
  vx: 0, vy: 0,
  onGround: false, facing: 1,
  runFrame: 0, deadTimer: 0, invincible: 0,
};

function buildLevel() {
  tiles = [];
  enemies = [];
  particles = [];
  floatTexts = [];
  bumpAnims = [];
  for (let r = 0; r < LEVEL_H; r++) {
    tiles[r] = [];
    for (let c = 0; c < LEVEL_W; c++) {
      const ch = (LEVEL[r][c] || " ");
      if (ch === "S") {
        player.x = c * TILE; player.y = r * TILE;
        tiles[r][c] = " ";
      } else if (ch === "g" || ch === "k") {
        enemies.push({
          type: ch === "g" ? "goomba" : "koopa",
          x: c * TILE + 4, y: r * TILE + (TILE - 28),
          w: 24, h: 28, vx: -1, vy: 0,
          alive: true, squashTimer: 0, active: false,
        });
        tiles[r][c] = " ";
      } else if (ch === "P") {
        // build pipe: 2 wide, top sits one tile above the marker, extends down to ground
        const topR = Math.max(0, r - 1);
        for (let rr = topR; rr < LEVEL_H; rr++) {
          if ((LEVEL[rr][c] || " ") === "X") break;
          tiles[rr] = tiles[rr] || [];
          tiles[rr][c] = rr === topR ? "p" : "b";   // body left
          tiles[rr][c + 1] = rr === topR ? "q" : "d"; // body right
        }
        tiles[r][c] = tiles[r][c] || "b";
      } else if (ch === "F") {
        flagX = c * TILE;
        tiles[r][c] = "F";
      } else {
        if (tiles[r][c] === undefined) tiles[r][c] = ch === "|" ? "|" : ch;
      }
    }
  }
}

function startGame() {
  game.score = 0; game.coins = 0; game.lives = 3;
  resetLevel();
  game.state = "play";
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function resetLevel() {
  buildLevel();
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.facing = 1;
  player.deadTimer = 0; player.invincible = 60;
  game.time = 300; game.timer = 0; game.camX = 0;
  flagSlide = false;
}

const SOLID = new Set(["X","B","?","=","#","p","q","b","d"]);
function tileAt(c, r) {
  if (r < 0 || c < 0 || c >= LEVEL_W) return " ";
  if (r >= LEVEL_H) return " "; // fall into pit
  return tiles[r][c] || " ";
}
function isSolid(c, r) { return SOLID.has(tileAt(c, r)); }

// ---------- Physics & collisions ----------
function moveAndCollide(ent) {
  // horizontal
  ent.x += ent.vx;
  let cTop = Math.floor(ent.y / TILE), cBot = Math.floor((ent.y + ent.h - 1) / TILE);
  if (ent.vx > 0) {
    const cc = Math.floor((ent.x + ent.w) / TILE);
    for (let r = cTop; r <= cBot; r++) if (isSolid(cc, r)) {
      ent.x = cc * TILE - ent.w; ent.vx = ent === player ? 0 : -ent.vx; ent.hitWall = true;
      break;
    }
  } else if (ent.vx < 0) {
    const cc = Math.floor(ent.x / TILE);
    for (let r = cTop; r <= cBot; r++) if (isSolid(cc, r)) {
      ent.x = (cc + 1) * TILE; ent.vx = ent === player ? 0 : -ent.vx; ent.hitWall = true;
      break;
    }
  }
  // vertical
  ent.y += ent.vy;
  ent.onGround = false;
  const cL = Math.floor((ent.x + 2) / TILE), cR = Math.floor((ent.x + ent.w - 3) / TILE);
  if (ent.vy > 0) {
    const rr = Math.floor((ent.y + ent.h) / TILE);
    for (let c = cL; c <= cR; c++) if (isSolid(c, rr)) {
      ent.y = rr * TILE - ent.h; ent.vy = 0; ent.onGround = true;
      break;
    }
  } else if (ent.vy < 0) {
    const rr = Math.floor(ent.y / TILE);
    for (let c = cL; c <= cR; c++) if (isSolid(c, rr)) {
      ent.y = (rr + 1) * TILE; ent.vy = 0;
      if (ent === player) hitBlockFromBelow(c, rr);
      break;
    }
  }
}

function hitBlockFromBelow(c, r) {
  const t = tileAt(c, r);
  if (t === "?") {
    tiles[r][c] = "=";
    bumpAnims.push({ c, r, t: 8 });
    game.coins++; game.score += 200;
    sfx.coin();
    particles.push({ x: c * TILE + TILE/2, y: r * TILE - 8, vy: -6, vx: 0, type: "coinPop", life: 24 });
    floatTexts.push({ x: c * TILE, y: r * TILE - 10, text: "+200", life: 40 });
    if (game.coins % 10 === 0) { game.lives++; floatTexts.push({ x: c*TILE, y: r*TILE - 30, text: "1UP!", life: 60 }); }
  } else if (t === "B") {
    tiles[r][c] = " ";
    game.score += 50;
    sfx.brick();
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: c * TILE + TILE/2, y: r * TILE + TILE/2,
        vx: (i % 2 ? 2.5 : -2.5), vy: i < 2 ? -7 : -4,
        type: "brick", life: 50,
      });
    }
  } else {
    sfx.bump();
    bumpAnims.push({ c, r, t: 6 });
  }
  // bounce enemies standing on the bumped block
  for (const e of enemies) {
    if (!e.alive) continue;
    const ec = Math.floor((e.x + e.w/2) / TILE);
    const er = Math.floor((e.y + e.h) / TILE);
    if (ec === c && er === r) { e.alive = false; e.vy = -8; e.flipped = true; game.score += 100; }
  }
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Update ----------
function update() {
  game.frame++;
  if (game.state !== "play" && game.state !== "dead") return;

  if (game.state === "dead") return;

  // timer
  game.timer++;
  if (game.timer % 60 === 0 && !flagSlide) {
    game.time--;
    if (game.time <= 0) return killPlayer(true);
  }

  if (player.deadTimer > 0) {
    player.deadTimer++;
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.deadTimer > 110) {
      game.lives--;
      if (game.lives <= 0) { game.state = "gameover"; }
      else resetLevel();
    }
    return;
  }

  if (flagSlide) {
    // slide down pole, then walk off
    if (player.y + player.h < 13 * TILE) {
      player.y += 4;
    } else {
      player.x += 2;
      if (player.x > flagX + 3 * TILE) game.state = "win";
    }
    updateParticles();
    return;
  }

  // --- player control ---
  const accel = 0.4, maxSpeed = run() ? 5.5 : 3.2, friction = 0.82;
  if (left())  { player.vx -= accel; player.facing = -1; }
  if (right()) { player.vx += accel; player.facing = 1; }
  if (!left() && !right()) player.vx *= friction;
  if (Math.abs(player.vx) < 0.1) player.vx = 0;
  player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));

  if (jump() && player.onGround && !player.jumpHeld) {
    player.vy = -11.5;
    player.jumpHeld = true;
    sfx.jump();
  }
  if (!jump()) player.jumpHeld = false;
  // variable jump height
  if (player.vy < -4 && !jump()) player.vy = -4;

  player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
  player.prevBottom = player.y + player.h;
  moveAndCollide(player);
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.invincible > 0) player.invincible--;
  if (Math.abs(player.vx) > 0.5 && player.onGround) player.runFrame += Math.abs(player.vx) * 0.04;

  // fell into pit
  if (player.y > LEVEL_H * TILE + 50) return killPlayer(true);

  // coins in world
  const pcL = Math.floor(player.x / TILE), pcR = Math.floor((player.x + player.w) / TILE);
  const prT = Math.floor(player.y / TILE), prB = Math.floor((player.y + player.h) / TILE);
  for (let r = prT; r <= prB; r++) for (let c = pcL; c <= pcR; c++) {
    if (tileAt(c, r) === "C") {
      tiles[r][c] = " ";
      game.coins++; game.score += 100;
      sfx.coin();
      floatTexts.push({ x: c * TILE, y: r * TILE, text: "+100", life: 40 });
      if (game.coins % 10 === 0) { game.lives++; floatTexts.push({ x: c*TILE, y: r*TILE - 20, text: "1UP!", life: 60 }); }
    }
  }

  // flag
  if (player.x + player.w > flagX + 8 && !flagSlide) {
    flagSlide = true;
    game.score += Math.max(0, game.time) * 10 + 1000;
    sfx.win();
    player.x = flagX - 4;
    player.vx = 0; player.vy = 0;
  }

  // --- enemies ---
  for (const e of enemies) {
    // activate when near camera
    if (!e.active && e.x < game.camX + W + 64) e.active = true;
    if (!e.active) continue;

    if (!e.alive) {
      if (e.flipped) { // knocked off screen
        e.vy += GRAVITY; e.y += e.vy;
      } else {
        e.squashTimer++;
      }
      continue;
    }

    // turn at edges so goombas patrol platforms
    e.vy = Math.min(e.vy + GRAVITY, MAX_FALL);
    e.hitWall = false;
    moveAndCollide(e);
    if (e.onGround) {
      const aheadC = Math.floor((e.x + (e.vx > 0 ? e.w + 2 : -2)) / TILE);
      const belowR = Math.floor((e.y + e.h + 4) / TILE);
      if (!isSolid(aheadC, belowR)) e.vx = -e.vx;
    }
    if (e.y > LEVEL_H * TILE + 100) { e.alive = false; e.flipped = true; }

    // player collision
    if (player.deadTimer === 0 && player.invincible === 0 && rectsOverlap(player, e)) {
      // it's a stomp if the player is falling and was above the enemy last frame
      const stomping = player.vy > 0 && player.prevBottom <= e.y + 12;
      if (stomping) {
        e.alive = false;
        player.vy = -7;
        game.score += 100;
        sfx.stomp();
        floatTexts.push({ x: e.x, y: e.y - 10, text: "+100", life: 40 });
      } else {
        killPlayer(false);
      }
    }
  }

  updateParticles();
}

function updateParticles() {
  for (const p of particles) {
    p.vy += 0.4; p.x += p.vx; p.y += p.vy; p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floatTexts) { f.y -= 0.8; f.life--; }
  floatTexts = floatTexts.filter(f => f.life > 0);
  for (const b of bumpAnims) b.t--;
  bumpAnims = bumpAnims.filter(b => b.t > 0);

  // camera follows player (only forward-biased like the original... but allow back-scroll for kindness)
  const target = player.x - W * 0.38;
  game.camX += (target - game.camX) * 0.12;
  game.camX = Math.max(0, Math.min(game.camX, LEVEL_W * TILE - W));
}

function killPlayer(instant) {
  if (player.deadTimer > 0) return;
  sfx.die();
  player.deadTimer = 1;
  player.vy = -10;
  if (instant) player.y = Math.min(player.y, LEVEL_H * TILE);
}

// ---------- Rendering ----------
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#5C94FC");
  grad.addColorStop(1, "#7EB8FF");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // parallax clouds & hills
  const cx = game.camX;
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  for (let i = 0; i < 12; i++) {
    const x = ((i * 340 + 80) - cx * 0.3) % (LEVEL_W * TILE * 0.3);
    drawCloud(x, 50 + (i % 3) * 45);
  }
  // hills
  ctx.fillStyle = "#1f8f1f";
  for (let i = 0; i < 14; i++) {
    const x = ((i * 420) - cx * 0.55) % (LEVEL_W * TILE * 0.55);
    const baseY = 13 * TILE;
    ctx.beginPath();
    ctx.moveTo(x - 70, baseY);
    ctx.quadraticCurveTo(x, baseY - 110, x + 70, baseY);
    ctx.fill();
  }
}
function drawCloud(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, 7);
  ctx.arc(x + 18, y - 8, 18, 0, 7);
  ctx.arc(x + 38, y, 16, 0, 7);
  ctx.fill();
}

function drawTile(t, x, y, c, r) {
  // bump offset
  let by = 0;
  for (const b of bumpAnims) if (b.c === c && b.r === r) by = -Math.sin((b.t / 8) * Math.PI) * 8;
  y += by;

  switch (t) {
    case "X": // ground
      ctx.fillStyle = "#C84C0C";
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = "#E45C10";
      ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = "#C84C0C";
      ctx.fillRect(x + 2, y + TILE/2 - 1, TILE - 4, 2);
      ctx.fillRect(x + TILE/2 - 1, y + 2, 2, TILE/2 - 2);
      ctx.fillRect(x + 8, y + TILE/2, 2, TILE/2 - 2);
      ctx.fillRect(x + TILE - 10, y + TILE/2, 2, TILE/2 - 2);
      break;
    case "B": // brick
      ctx.fillStyle = "#B85410";
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = "#000";
      ctx.fillRect(x, y + TILE/2 - 1, TILE, 2);
      ctx.fillRect(x, y + TILE - 2, TILE, 2);
      ctx.fillRect(x + TILE/2 - 1, y, 2, TILE/2);
      ctx.fillRect(x + 6, y + TILE/2, 2, TILE/2);
      ctx.fillRect(x + TILE - 8, y + TILE/2, 2, TILE/2);
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(x, y, TILE, 3);
      break;
    case "?": { // question block
      ctx.fillStyle = "#FAC000";
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = "#E89000";
      ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = "#FAC000";
      ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
      const pulse = Math.sin(game.frame * 0.1) > 0 ? "#FFF" : "#7a4a00";
      ctx.fillStyle = pulse;
      ctx.font = "bold 20px monospace";
      ctx.textAlign = "center";
      ctx.fillText("?", x + TILE/2, y + TILE - 9);
      break;
    }
    case "=": // used block
      ctx.fillStyle = "#9C5A2C";
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = "#7a4520";
      ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
      break;
    case "#": // stair block
      ctx.fillStyle = "#C0731F";
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = "#8a5215";
      ctx.fillRect(x, y, TILE, 3);
      ctx.fillRect(x, y, 3, TILE);
      ctx.fillStyle = "#e69035";
      ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
      break;
    case "p": case "q": { // pipe top
      const isLeft = t === "p";
      ctx.fillStyle = "#00A800";
      ctx.fillRect(x - (isLeft ? 4 : 0), y, TILE + 4, TILE);
      ctx.fillStyle = "#80D010";
      ctx.fillRect(x - (isLeft ? 2 : -4), y + 2, 8, TILE - 4);
      ctx.fillStyle = "#005800";
      ctx.fillRect(x + (isLeft ? -4 : TILE - 2), y, 2, TILE);
      ctx.fillRect(x - (isLeft ? 4 : 0), y + TILE - 2, TILE + 4, 2);
      break;
    }
    case "b": case "d": { // pipe body
      const isLeft = t === "b";
      ctx.fillStyle = "#00A800";
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = "#80D010";
      ctx.fillRect(x + (isLeft ? 2 : 8), y, 8, TILE);
      ctx.fillStyle = "#005800";
      ctx.fillRect(x + (isLeft ? 0 : TILE - 2), y, 2, TILE);
      break;
    }
    case "C": { // coin
      const bob = Math.sin(game.frame * 0.12 + c) * 3;
      const sq = Math.abs(Math.sin(game.frame * 0.07 + c)); // spin
      ctx.fillStyle = "#FAC000";
      ctx.beginPath();
      ctx.ellipse(x + TILE/2, y + TILE/2 + bob, 7 * Math.max(0.25, sq), 10, 0, 0, 7);
      ctx.fill();
      ctx.strokeStyle = "#7a4a00";
      ctx.lineWidth = 2;
      ctx.stroke();
      break;
    }
    case "F": case "|": { // flagpole
      ctx.fillStyle = "#00B800";
      ctx.fillRect(x + TILE/2 - 2, y, 4, TILE);
      if (t === "F") {
        ctx.beginPath();
        ctx.arc(x + TILE/2, y, 6, 0, 7);
        ctx.fillStyle = "#FAC000";
        ctx.fill();
        // flag
        const fy = flagSlide ? Math.min(y + 8 * TILE, y + 8 + game.frame % 1000) : y + 8;
        ctx.fillStyle = "#E40058";
        ctx.beginPath();
        ctx.moveTo(x + TILE/2 - 2, y + 8);
        ctx.lineTo(x + TILE/2 - 30, y + 18);
        ctx.lineTo(x + TILE/2 - 2, y + 28);
        ctx.fill();
      }
      break;
    }
  }
}

function drawPlayer() {
  if (player.invincible > 0 && Math.floor(game.frame / 4) % 2 === 0 && player.deadTimer === 0) return;
  const x = player.x - game.camX, y = player.y;
  const f = player.facing;
  ctx.save();
  ctx.translate(x + player.w/2, y);
  ctx.scale(f, 1);
  if (player.deadTimer > 0) ctx.rotate(Math.sin(player.deadTimer * 0.2) * 0.4);

  const px = -player.w/2;
  // legs (animate)
  const step = player.onGround && Math.abs(player.vx) > 0.5 ? Math.sin(player.runFrame * 6) * 4 : 0;
  ctx.fillStyle = "#0048FF"; // blue overalls
  ctx.fillRect(px + 3, 14, 8, 12 + step);
  ctx.fillRect(px + 13, 14, 8, 12 - step);
  // overalls body
  ctx.fillRect(px + 3, 10, 18, 9);
  // shirt arms
  ctx.fillStyle = "#E40000";
  ctx.fillRect(px + 1, 9, 4, 8);
  ctx.fillRect(px + 19, 9, 4, 8);
  ctx.fillRect(px + 5, 8, 14, 4);
  // head
  ctx.fillStyle = "#FFC8A0";
  ctx.fillRect(px + 4, -2, 16, 12);
  // cap
  ctx.fillStyle = "#E40000";
  ctx.fillRect(px + 2, -6, 20, 6);
  ctx.fillRect(px + 12, -2, 12, 3);
  // eye
  ctx.fillStyle = "#000";
  ctx.fillRect(px + 15, 1, 3, 4);
  // moustache
  ctx.fillRect(px + 13, 7, 9, 3);
  // shoes
  ctx.fillStyle = "#7a3000";
  ctx.fillRect(px + 1, 24 + step, 9, 6);
  ctx.fillRect(px + 14, 24 - step, 9, 6);
  ctx.restore();
}

function drawEnemy(e) {
  const x = e.x - game.camX, y = e.y;
  if (x < -50 || x > W + 50) return;
  ctx.save();
  if (!e.alive && !e.flipped) {
    // squashed
    if (e.squashTimer < 30) {
      ctx.fillStyle = "#8a4b14";
      ctx.fillRect(x, y + e.h - 10, e.w, 10);
      ctx.fillStyle = "#000";
      ctx.fillRect(x + 4, y + e.h - 7, 4, 3);
      ctx.fillRect(x + e.w - 8, y + e.h - 7, 4, 3);
    }
    ctx.restore();
    return;
  }
  if (e.flipped) { ctx.translate(x + e.w/2, y + e.h/2); ctx.rotate(Math.PI); ctx.translate(-(x + e.w/2), -(y + e.h/2)); }
  const wob = Math.sin(game.frame * 0.15 + e.x) * 2;
  // goomba body
  ctx.fillStyle = "#9C5018";
  ctx.beginPath();
  ctx.ellipse(x + e.w/2, y + 12, 13, 12, 0, 0, 7);
  ctx.fill();
  // feet
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.ellipse(x + 7 + wob, y + e.h - 3, 6, 4, 0, 0, 7);
  ctx.ellipse(x + e.w - 7 - wob, y + e.h - 3, 6, 4, 0, 0, 7);
  ctx.fill();
  // eyes
  ctx.fillStyle = "#FFF";
  ctx.beginPath();
  ctx.ellipse(x + 8, y + 9, 4, 5, -0.2, 0, 7);
  ctx.ellipse(x + e.w - 8, y + 9, 4, 5, 0.2, 0, 7);
  ctx.fill();
  ctx.fillStyle = "#000";
  ctx.fillRect(x + 7, y + 9, 2, 4);
  ctx.fillRect(x + e.w - 9, y + 9, 2, 4);
  // angry brows
  ctx.fillRect(x + 5, y + 4, 6, 2);
  ctx.fillRect(x + e.w - 11, y + 4, 6, 2);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const x = p.x - game.camX;
    if (p.type === "brick") {
      ctx.fillStyle = "#B85410";
      ctx.save();
      ctx.translate(x, p.y);
      ctx.rotate(p.life * 0.2);
      ctx.fillRect(-5, -5, 10, 10);
      ctx.restore();
    } else if (p.type === "coinPop") {
      ctx.fillStyle = "#FAC000";
      ctx.beginPath();
      ctx.ellipse(x, p.y, 6, 9, 0, 0, 7);
      ctx.fill();
      ctx.strokeStyle = "#7a4a00";
      ctx.stroke();
    }
  }
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "left";
  for (const f of floatTexts) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, f.life / 20)})`;
    ctx.fillText(f.text, f.x - game.camX, f.y);
  }
}

function drawHUD() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, 36);
  ctx.fillStyle = "#FFF";
  ctx.font = "bold 16px monospace";
  ctx.textAlign = "left";
  ctx.fillText(`SCORE ${String(game.score).padStart(6, "0")}`, 16, 24);
  ctx.fillText(`🪙 ×${game.coins}`, 240, 24);
  ctx.fillText(`MARIO ×${game.lives}`, 380, 24);
  ctx.textAlign = "right";
  ctx.fillText(`TIME ${Math.max(0, game.time)}`, W - 16, 24);
}

function drawCenteredScreen(title, subtitle, sub2) {
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#FFF";
  ctx.textAlign = "center";
  ctx.font = "bold 48px monospace";
  ctx.fillText(title, W/2, H/2 - 40);
  ctx.font = "bold 20px monospace";
  if (subtitle) ctx.fillText(subtitle, W/2, H/2 + 10);
  if (sub2 && Math.floor(game.frame / 30) % 2 === 0) ctx.fillText(sub2, W/2, H/2 + 60);
}

function render() {
  drawSky();

  // tiles in view
  const c0 = Math.floor(game.camX / TILE), c1 = Math.ceil((game.camX + W) / TILE);
  for (let r = 0; r < LEVEL_H; r++) {
    for (let c = c0; c <= c1 && c < LEVEL_W; c++) {
      const t = tileAt(c, r);
      if (t !== " ") drawTile(t, c * TILE - game.camX, r * TILE, c, r);
    }
  }

  for (const e of enemies) drawEnemy(e);
  drawPlayer();
  drawParticles();
  drawHUD();

  if (game.state === "title") {
    drawCenteredScreen("SUPER MARIO", "CLASSIC", "PRESS SPACE TO START");
    ctx.font = "14px monospace";
    ctx.fillText("just like the one we used to play 🍄", W/2, H/2 + 110);
  } else if (game.state === "pause") {
    drawCenteredScreen("PAUSED", "", "PRESS P TO RESUME");
  } else if (game.state === "gameover") {
    drawCenteredScreen("GAME OVER", `FINAL SCORE ${game.score}`, "PRESS SPACE TO RETRY");
  } else if (game.state === "win") {
    drawCenteredScreen("COURSE CLEAR!", `SCORE ${game.score}   COINS ${game.coins}`, "PRESS SPACE TO PLAY AGAIN");
  }
}

// ---------- Main loop ----------
buildLevel();
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
